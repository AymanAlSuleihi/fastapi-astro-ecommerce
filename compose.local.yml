# Run: docker compose -f compose.yml -f compose.local.yml up
# Docker compose auto-loads .env (NOT .env.local)
# Override with: docker compose --env-file .env.local -f compose.yml -f compose.local.yml up

services:
  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.local
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: fastapi dev src/main.py --host 0.0.0.0 --reload

  worker:
    env_file:
      - .env
      - .env.local
    volumes:
      - ./backend/src:/app/src
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: taskiq worker src.worker.settings:broker

  frontend:
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev -- --host 0.0.0.0
